<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Picker</title>
<style>
  :root {
    --bg: #14110f; --panel: #1d1916; --panel-2: #26211d; --line: #3a322b;
    --text: #e8dfd3; --muted: #9b8f80; --accent: #e0a040; --accent-ink: #1a1206;
    --ok: #7fbf6a; --warn: #e07a4f; --chosen: #3b2c14;
    --t2: #5fb3c9; --t3: #b48ce0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(20,17,15,.96);
           border-bottom: 1px solid var(--line); padding: 10px 16px;
           display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); }
  .pill.on { color: var(--ok); border-color: #4b6b3f; }
  .pill.off { color: var(--warn); border-color: #6b3f2c; }
  input[type=search] { background: var(--panel); color: var(--text); border: 1px solid var(--line);
                       border-radius: 6px; padding: 6px 10px; width: 200px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { background: none; border: 0; color: var(--muted); padding: 5px 10px; cursor: pointer; }
  .seg button.on { background: var(--panel-2); color: var(--text); }
  label.check { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .count { color: var(--muted); font-size: 12px; margin-left: auto; }
  main { padding: 8px 16px 80px; max-width: 1100px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
       margin: 22px 0 8px; font-weight: 600; }
  .clip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
          padding: 10px 12px; margin: 6px 0; outline: none; }
  .clip:focus-within, .clip.focus { border-color: #5a4a36; }
  .top { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
  .name { font: 600 14px ui-monospace, "SFMono-Regular", monospace; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--panel-2); color: var(--muted); }
  .badge.t1 { color: var(--accent); }
  .badge.t2 { color: var(--t2); } .badge.t3 { color: var(--t3); }
  .clip.t2 { border-left: 3px solid var(--t2); } .clip.t3 { border-left: 3px solid var(--t3); }
  .tier { display: flex; align-items: baseline; gap: 10px; margin: 34px 0 0; padding: 8px 12px;
          border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); }
  .tier b { font-size: 15px; } .tier span { color: var(--muted); font-size: 12px; }
  .tier.t1 b { color: var(--accent); } .tier.t2 { border-color: var(--t2); } .tier.t2 b { color: var(--t2); }
  .tier.t3 { border-color: var(--t3); } .tier.t3 b { color: var(--t3); }
  .hook { color: var(--muted); font-size: 12px; flex: 1 1 260px; min-width: 0; }
  .hook code { font-size: 11px; color: #c8b9a6; }
  .actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  button.act { background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
               border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  button.act:hover { border-color: var(--accent); }
  button.act:disabled { opacity: .4; cursor: default; }
  .gain { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
  .gain button { width: 22px; padding: 2px 0; }
  .gain span { min-width: 46px; text-align: center; color: var(--text); font-variant-numeric: tabular-nums; }
  .takes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .take { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
          background: var(--panel-2); }
  .take.chosen { border-color: var(--accent); background: var(--chosen); }
  .take .play { background: none; border: 0; color: var(--text); padding: 6px 10px; cursor: pointer;
                display: flex; gap: 8px; align-items: center; text-align: left; }
  .take .play:hover { background: rgba(255,255,255,.04); }
  .take .play.playing { color: var(--accent); }
  .take .num { font-weight: 700; font-variant-numeric: tabular-nums; }
  .take .meta { font-size: 11px; color: var(--muted); }
  .take .warn { color: var(--warn); }
  .take .use, .take .add { border: 0; border-left: 1px solid var(--line); background: none; color: var(--muted);
                           padding: 0 10px; cursor: pointer; font-size: 12px; }
  .take .use:hover, .take .add:hover { color: var(--accent); }
  .take.chosen .use { color: var(--accent); font-weight: 600; }
  .none { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .default { color: var(--muted); font-size: 11px; }
  #toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: min(720px, calc(100vw - 32px));
           background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px;
           font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: pre-wrap; }
  #toast.show { opacity: 1; }
  #toast.err { border-color: var(--warn); color: #f3c0a8; }
  .help { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<header>
  <h1>Sound picker</h1>
  <span id="game" class="pill">checking the game…</span>
  <input id="q" type="search" placeholder="Filter clips">
  <span class="seg" id="tiers">
    <button data-tier="0" class="on">All</button><button data-tier="1">Tier 1</button><button data-tier="2">2</button><button data-tier="3">3</button>
  </span>
  <label class="check"><input id="withTakes" type="checkbox" checked> With takes</label>
  <span class="count" id="count"></span>
</header>
<main>
  <p class="help">Click a take to hear it here; <b>Use</b> puts it in the game (and plays it 3 m in front of you); <b>+</b> adds it as a variant, played in turn.
    Over a clip: <kbd>1</kbd>–<kbd>9</kbd> hear take n, <kbd>Shift</kbd>+<kbd>1</kbd>–<kbd>9</kbd> use it, <kbd>G</kbd> play it in the game, <kbd>Space</kbd> stop.</p>
  <div id="list"></div>
</main>
<div id="toast"></div>
<script>
const TIER_NAMES = {1: "the core combat loop", 2: "the world feeling alive", 3: "polish"};
const state = { clips: [], tier: 0, q: "", withTakes: true, focus: null };
const audio = new Audio();
let playingKey = null;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function toast(text, err) {
  const t = $("#toast");
  t.textContent = text;
  t.className = "show" + (err ? " err" : "");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.className = err ? "err" : "", err ? 6000 : 2500);
}

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

async function checkGame() {
  try {
    const g = await api("/api/game");
    const pill = $("#game");
    pill.className = "pill " + (g.running ? "on" : "off");
    pill.textContent = g.running ? `game on :${g.port}` : `no game on :${g.port}`;
    pill.title = g.running ? g.root.replace(/^"|"$/g, "") : g.note;
  } catch (e) { /* the picker itself stopped */ }
}

async function load() {
  state.clips = (await api("/api/clips")).clips;
  render();
}

function shown(c) {
  if (state.tier && c.tier !== state.tier) return false;
  if (state.withTakes && !c.takes.length) return false;
  if (state.q && !(c.name + " " + c.hook + " " + c.section).toLowerCase().includes(state.q)) return false;
  return true;
}

function clipHTML(c) {
  const chosen = new Set(c.pick.takes);
  const takes = c.takes.map(t => {
    const warn = t.clipped > 50 ? `<span class="warn">clips ${t.clipped}</span>`
               : t.peak < -24 ? `<span class="warn">quiet</span>` : "";
    const on = chosen.has(t.take);
    return `<div class="take${on ? " chosen" : ""}">
      <button class="play" data-play="${t.take}" title="${esc(t.file)}, peak ${t.peak} dBFS">
        <span class="num">${t.take}</span><span class="meta">${t.seconds.toFixed(2)} s ${warn}</span></button>
      <button class="use" data-use="${t.take}" title="Use only this take">${on && chosen.size === 1 ? "In use" : "Use"}</button>
      <button class="add" data-add="${t.take}" title="${on ? "Drop from" : "Add to"} the variants">${on ? "−" : "+"}</button>
    </div>`;
  }).join("");
  const gain = c.pick.gain || 0;
  return `<div class="clip t${c.tier}" tabindex="0" data-clip="${c.name}">
    <div class="top">
      <span class="name">${c.name}</span>
      <span class="badge t${c.tier}">tier ${c.tier}</span>
      <span class="badge">${c.positional ? "positional" : "first-person"}${c.loop ? " · loop" : ""}</span>
      ${c.pick.default && c.takes.length ? `<span class="default">take 1 by default</span>` : ""}
      <span class="hook">${esc(c.hook).replace(/`([^`]+)`/g, "<code>$1</code>")}</span>
      <span class="actions">
        <span class="gain" title="Gain on this clip's level, dB">gain
          <button class="act" data-gain="-1">−</button><span>${gain > 0 ? "+" : ""}${gain} dB</span><button class="act" data-gain="1">+</button></span>
        <button class="act" data-game ${c.takes.length ? "" : "disabled"}>▶ In game</button>
      </span>
    </div>
    ${c.takes.length ? `<div class="takes">${takes}</div>` : `<div class="none">No takes yet: generate them with tools/gen_sfx.py.</div>`}
  </div>`;
}

function render() {
  const list = $("#list");
  // Tier by tier, each in the table's order, so the newer tiers stand apart.
  const visible = state.clips.filter(shown).map((c, i) => [c, i])
    .sort((a, b) => a[0].tier - b[0].tier || a[1] - b[1]).map(x => x[0]);
  let html = "", section = null, tier = null;
  for (const c of visible) {
    if (c.tier !== tier) {
      tier = c.tier; section = null;
      const n = visible.filter(x => x.tier === tier).length;
      const done = visible.filter(x => x.tier === tier && !x.pick.default).length;
      html += `<div class="tier t${tier}"><b>Tier ${tier}</b><span>${TIER_NAMES[tier] || ""} · ${n} clips, ${done} chosen</span></div>`;
    }
    if (c.section !== section) { section = c.section; html += `<h2>${esc(section)}</h2>`; }
    html += clipHTML(c);
  }
  list.innerHTML = html || `<p class="none">No clips match.</p>`;
  const picked = state.clips.filter(c => c.takes.length && !c.pick.default).length;
  const withTakes = state.clips.filter(c => c.takes.length).length;
  $("#count").textContent = `${visible.length} shown · ${picked} of ${withTakes} chosen`;
  if (playingKey) markPlaying(playingKey);
}

function clipOf(el) { return state.clips.find(c => c.name === el.closest(".clip").dataset.clip); }

function markPlaying(key) {
  document.querySelectorAll(".play.playing").forEach(b => b.classList.remove("playing"));
  if (!key) return;
  const [name, take] = key.split("#");
  const b = document.querySelector(`.clip[data-clip="${name}"] [data-play="${take}"]`);
  if (b) b.classList.add("playing");
}

function preview(c, take) {
  const t = c.takes.find(t => t.take === take);
  if (!t) return;
  const key = `${c.name}#${take}`;
  if (playingKey === key && !audio.paused) { stop(); return; }
  audio.src = `/take/${t.file}`;
  audio.loop = c.loop;
  audio.play();
  playingKey = key;
  markPlaying(key);
}

function stop() { audio.pause(); playingKey = null; markPlaying(null); }
audio.addEventListener("ended", () => { playingKey = null; markPlaying(null); });

async function use(c, takes, gain = c.pick.gain || 0) {
  takes = [...new Set(takes)].sort((a, b) => a - b);
  if (!takes.length) { toast("A clip needs at least one take.", true); return; }
  toast(`${c.name}: converting…`);
  try {
    const r = await api("/api/use", {clip: c.name, takes, gain});
    c.pick = {takes, gain};
    render();
    toast(r.note ? `${c.name}: take ${takes.join(", ")} saved, but not swapped in: ${r.note}`
                 : `${c.name}: take ${takes.join(", ")}${gain ? `, ${gain > 0 ? "+" : ""}${gain} dB` : ""} — swapped into the game`, !!r.note);
  } catch (e) { toast(`${c.name}: ${e.message}`, true); }
}

async function inGame(c) {
  try { await api("/api/audition", {clip: c.name}); toast(`${c.name}: playing in the game`); }
  catch (e) { toast(e.message, true); }
}

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || !b.closest(".clip")) return;
  const c = clipOf(b);
  state.focus = c.name;
  if (b.dataset.play) preview(c, +b.dataset.play);
  else if (b.dataset.use) use(c, [+b.dataset.use]);
  else if (b.dataset.add) {
    const n = +b.dataset.add, now = new Set(c.pick.takes);
    now.has(n) ? now.delete(n) : now.add(n);
    use(c, [...now]);
  }
  else if (b.dataset.gain) use(c, c.pick.takes.length ? c.pick.takes : [1], (c.pick.gain || 0) + +b.dataset.gain);
  else if ("game" in b.dataset) inGame(c);
});

document.addEventListener("mouseover", e => {
  const el = e.target.closest(".clip");
  if (el) state.focus = el.dataset.clip;
});

document.addEventListener("keydown", e => {
  if (e.target.matches("input")) return;
  const c = state.clips.find(c => c.name === state.focus);
  if (e.code === "Space") { e.preventDefault(); stop(); return; }
  if (!c) return;
  const digit = e.code.match(/^Digit([1-9])$/);
  if (digit) { e.preventDefault(); e.shiftKey ? use(c, [+digit[1]]) : preview(c, +digit[1]); }
  else if (e.key === "g" || e.key === "G") inGame(c);
});

$("#q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); render(); });
$("#withTakes").addEventListener("change", e => { state.withTakes = e.target.checked; render(); });
$("#tiers").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.tier = +b.dataset.tier;
  document.querySelectorAll("#tiers button").forEach(x => x.classList.toggle("on", x === b));
  render();
});

load().catch(e => toast(e.message, true));
checkGame();
setInterval(checkGame, 5000);
</script>
</body>
</html>
