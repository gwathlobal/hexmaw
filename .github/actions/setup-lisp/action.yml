name: Set up SBCL and the game's libraries
description: >
  Installs SBCL and the project's own Quicklisp in .ql/ with the two pinned dists
  (tools/setup-ql), then compiles the game's libraries once, so a later compile's warnings
  are the game's own. Every Lisp session goes through boot.lisp with --no-userinit, as on
  the author's machine (CLAUDE.md, "Running"). The native libraries the game ships (GLFW,
  libmixed, the Vorbis decoder, evdev) come prebuilt with their Lisp libraries, so nothing
  else is installed here.

inputs:
  sbcl-version:
    description: >
      SBCL version to install on Linux and Windows. Ignored on macOS, for which SBCL
      publishes no binaries: there it is Homebrew's current version, which the job reports.
    required: true

runs:
  using: composite
  steps:
    - name: Install SBCL (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        v='${{ inputs.sbcl-version }}'
        curl -fsSL --retry 5 --retry-delay 4 -o sbcl-binary.tar.bz2 \
          "https://downloads.sourceforge.net/project/sbcl/sbcl/$v/sbcl-$v-x86-64-linux-binary.tar.bz2"
        tar -xjf sbcl-binary.tar.bz2
        (cd "sbcl-$v-x86-64-linux" && sudo sh install.sh)
        rm -rf sbcl-binary.tar.bz2 "sbcl-$v-x86-64-linux"

    - name: Install SBCL (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install sbcl

    - name: Install SBCL (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $v = '${{ inputs.sbcl-version }}'
        $url = "https://downloads.sourceforge.net/project/sbcl/sbcl/$v/sbcl-$v-x86-64-windows-binary.msi"
        curl.exe -fsSL --retry 5 --retry-delay 4 -o sbcl.msi $url
        # msiexec is a GUI-subsystem program: -Wait -PassThru is the only way to get both
        # completion and an exit code out of it.
        $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', "$pwd\sbcl.msi", '/quiet', '/norestart'
        if ($p.ExitCode -ne 0) { throw "msiexec failed with exit code $($p.ExitCode)" }
        Remove-Item sbcl.msi
        $exe = Get-ChildItem -Path 'C:\Program Files' -Filter sbcl.exe -Recurse -ErrorAction SilentlyContinue |
               Select-Object -First 1
        if (-not $exe) { throw 'sbcl.exe is not where the MSI was expected to put it' }
        Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
        # sbcl.core and the contribs (asdf among them) sit next to the binary
        Add-Content -Path $env:GITHUB_ENV -Value "SBCL_HOME=$($exe.DirectoryName)"

    - name: Report the SBCL that will be used
      shell: bash
      run: sbcl --version

    - name: Cache the libraries and the fasl cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .ql
          ~/.cache/common-lisp
          ~/AppData/Local/cache/common-lisp
        key: lisp-${{ runner.os }}-${{ runner.arch }}-sbcl${{ inputs.sbcl-version }}-${{ hashFiles('tools/setup-ql', 'hexmaw.asd', 'hexmaw-blueprints.asd') }}
        restore-keys: |
          lisp-${{ runner.os }}-${{ runner.arch }}-sbcl${{ inputs.sbcl-version }}-

    - name: Set up the pinned dists
      shell: bash
      run: tools/setup-ql

    - name: Compile the game's libraries
      shell: bash
      run: |
        set -euo pipefail
        # boot.lisp loads the game, downloading and compiling every library the first time.
        # The game's own compile, with its warnings, is the workflow's job.
        sbcl --dynamic-space-size 4096 --noinform --no-userinit --non-interactive \
             --load boot.lisp --eval '(format t "~&libraries ready~%")' < /dev/null
